version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Shanghai
    volumes:
      - ${HOME}/.n8n:/home/node/.n8n
      - ./n8ndata:/home/node/n8ndata
      - ./fonts:/usr/share/fonts/truetype/host
    extra_hosts:
      - "host.docker.internal:host-gateway"
